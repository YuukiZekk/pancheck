# sieve 筛选面板（第一期：只读盘点 + 跑筛 + 清单导出）
# 用法：cp .env.example .env && 改路径 && docker compose up -d --build
# 浏览器打开 http://<NAS-IP>:8760
services:
  sieve-panel:
    build: .
    image: sieve-panel:latest
    container_name: sieve-panel
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-8760}:8760"
    environment:
      - TZ=Asia/Shanghai
      - PANEL_PASSWORD=${PANEL_PASSWORD:-}
      # 以下是面板「设置」页的默认值，对应下面挂进容器的路径
      - CD2_MOUNT=/media/cd2
      - CD2_CONFIG=/cd2-config
      - EMBY_DATA=/emby-data
    volumes:
      # 面板自己的配置、跑筛结果、CSV 都在这里
      - ./data:/data
      # 第一期全部只读挂载；rslave 让 CD2 的 FUSE 挂载在容器里可见
      - ${CD2_MOUNT_HOST}:/media/cd2:ro,rslave
      - ${CD2_CONFIG_HOST:-./empty}:/cd2-config:ro
      - ${EMBY_DATA_HOST}:/emby-data:ro
